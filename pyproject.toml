[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "sqlglot",
    "chromadb",
    "openai",
    "httpx",
    "sqlalchemy>=2.0",
    "pyodbc>=5.0",
    "python-dotenv"
]

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "ruff>=0.15,<0.18"]

[tool.setuptools]
packages = ["backend", "backend.components", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
