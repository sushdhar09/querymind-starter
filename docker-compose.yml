name: querymind

services:
  backend:
    build: .
    image: querymind-backend
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned so a copied .env cannot move state off the persistent volume.
      APP_DB_PATH: /var/lib/querymind/app.db
      CHROMA_PATH: /var/lib/querymind/chroma
      ANALYTICS_BACKEND: ${ANALYTICS_BACKEND:-azure}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env (copy .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    volumes:
      - querymind-data:/var/lib/querymind
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: querymind-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  querymind-data:
